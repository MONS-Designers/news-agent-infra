name: Smoke test (live deploy)

# Checks the live production deployment, not code in this repo — deliberately
# separate from a normal push/PR-triggered CI job. Manual only: run it by hand
# after a deploy. It has no schedule -- an empty cron string made GitHub reject
# the whole file, so every push to main showed a red run.
on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke test against live deployment
        run: python deploy/smoke_test.py
