# Pushes the real values of NewsAgent's 4 per-environment app secrets
# (database URL, SMTP password, Google OAuth client secret, session secret)
# from GitHub Environment secrets into the shared Key Vault, then restarts
# that environment's API app so the new value actually takes effect.
#
# GitHub Secrets is the source of truth for VALUES (so both Moshe and Naomi
# can manage them via repo settings, without needing local file access);
# Terraform (terraform/main.tf) is the source of truth for which secrets
# EXIST, via `azurerm_key_vault_secret` resources with `ignore_changes =
# [value]` -- Terraform never fights what this workflow writes.
#
# Uses GitHub's native Environments (`stage` / `prod`, each holding its own
# NEWSAGENT_* secrets) rather than a flat STAGE_X/PROD_X naming scheme --
# `environment:` below makes `secrets.NEWSAGENT_DATABASE_URL` etc. resolve
# against the selected environment automatically. Both environments already
# have required reviewers configured (repo Settings > Environments) -- this
# run will pause for approval before the steps below execute.
#
# Only 4 of each environment's 8 stored secrets are synced here
# (NEWSAGENT_DATABASE_URL/SMTP_PASSWORD/GOOGLE_CLIENT_SECRET/SESSION_SECRET).
# NEWSAGENT_GOOGLE_CLIENT_ID, NEWSAGENT_SMTP_USERNAME, EXTERNAL_LLM_AUTH_TOKEN
# and LOCAL_LLM_AUTH_TOKEN are also stored per-environment but have no
# corresponding `azurerm_key_vault_secret` resource yet -- wiring those in is
# separate follow-up work (the LLM ones are dead plumbing today regardless:
# `llm_provider` defaults to "mock" and nothing sets `external_llm_base_url`/
# `model`, so the app never reads them either way).
#
# Manual trigger only, not on every deploy -- deploy.yml already restarts
# prod on every push; running this workflow's Key Vault writes on every code
# deploy too would create a pointless new secret version each time, and stage
# has no restart mechanism to piggyback on at all (see the restart step
# below). Run this only when a secret value actually changes.
name: sync-secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [stage, prod]

permissions:
  id-token: write # required for OIDC federated login
  contents: read

concurrency:
  group: sync-secrets-${{ inputs.environment }}
  cancel-in-progress: false

env:
  KEY_VAULT: newsagent-kv

jobs:
  sync:
    runs-on: ubuntu-latest
    # Selects which GitHub Environment's secrets `secrets.*` resolves
    # against below, and triggers that environment's required-reviewer gate.
    environment: ${{ inputs.environment }}
    steps:
      # secret_prefix must match the `name` field of the 4
      # azurerm_key_vault_secret.api_{env}_* resources in terraform/main.tf
      # -- no single source of truth today, a rename needs both updated
      # together.
      - name: Resolve environment
        id: env
        run: |
          case "${{ inputs.environment }}" in
            stage)
              echo "secret_prefix=newsagent-api-stage" >> "$GITHUB_OUTPUT"
              echo "api_name=newsagent-api-stage" >> "$GITHUB_OUTPUT"
              echo "resource_group=newsagent-stage-rg" >> "$GITHUB_OUTPUT"
              ;;
            prod)
              echo "secret_prefix=newsagent-api-prod" >> "$GITHUB_OUTPUT"
              echo "api_name=newsagent-api-prod" >> "$GITHUB_OUTPUT"
              echo "resource_group=newsagent-prod-rg" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown environment: '${{ inputs.environment }}'" >&2
              exit 1
              ;;
          esac

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Values never touch `run:` as literal shell text -- passed via env so
      # they're masked in logs the same way GITHUB_TOKEN-style secrets are.
      - name: Push secrets to Key Vault
        env:
          DATABASE_URL: ${{ secrets.NEWSAGENT_DATABASE_URL }}
          SMTP_PASSWORD: ${{ secrets.NEWSAGENT_SMTP_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.NEWSAGENT_GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.NEWSAGENT_SESSION_SECRET }}
        run: |
          set -euo pipefail
          prefix="${{ steps.env.outputs.secret_prefix }}"
          az keyvault secret set --vault-name "$KEY_VAULT" --name "${prefix}-database-url" --value "$DATABASE_URL" -o none
          az keyvault secret set --vault-name "$KEY_VAULT" --name "${prefix}-smtp-password" --value "$SMTP_PASSWORD" -o none
          az keyvault secret set --vault-name "$KEY_VAULT" --name "${prefix}-google-client-secret" --value "$GOOGLE_CLIENT_SECRET" -o none
          az keyvault secret set --vault-name "$KEY_VAULT" --name "${prefix}-session-secret" --value "$SESSION_SECRET" -o none

      # KNOWN GAP (observed firsthand 2026-09-06/07, spec-secrets-sync): a
      # plain restart does not reliably make the App Service re-resolve its
      # `@Microsoft.KeyVault(...)` app settings to the new secret version --
      # prod's DB URL stayed stale through a restart that session, and only
      # an explicit `az webapp config appsettings set` (re-writing the exact
      # same reference string) forced the refresh. That command needs
      # Microsoft.Web/sites/config/write, deliberately NOT granted to this
      # CI identity (kept restart-only, see main.tf's Credential G comment).
      # So: if a rotated secret still isn't live after this workflow runs,
      # someone with existing Key Vault Secrets Officer + local az/Terraform
      # access must run that appsettings-touch command by hand -- same fix
      # as during that session. Don't "fix" this by widening the CI role
      # without that being a deliberate decision (it was raised and declined
      # once already).
      - name: Restart API app (forces a fresh pull of the new secret values)
        run: az webapp restart --name "${{ steps.env.outputs.api_name }}" --resource-group "${{ steps.env.outputs.resource_group }}"

      - name: Verify API is up
        run: |
          set -euo pipefail
          url="https://${{ steps.env.outputs.api_name }}.azurewebsites.net/health"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            [ "$code" = "200" ] && echo "Healthy after restart ($url)" && exit 0
            sleep 3
          done
          echo "Still not healthy after restart: $url" >&2
          exit 1
