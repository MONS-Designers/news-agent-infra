# Split-subdomain deploy: app.<domain> (static Vue SPA) / api.<domain>
# (FastAPI backend, proxied to uvicorn on 127.0.0.1:8000). Chosen over a
# single domain with path-based routing because the backend's /admin router
# prefix (/admin/sources) collides with the frontend's /admin SPA page route
# — a bare navigation to /admin under path-based routing would 404 on the
# backend instead of serving index.html. Subdomains make that collision
# structurally impossible: every path on api.* goes to the backend, full
# stop. Requires news-agent PR #47 (CORS + session_cookie_domain) merged and
# deployed — without it, login won't survive the cross-subdomain request.
#
# REPLACE_WITH_DOMAIN throughout — e.g. app.newsagent-ai.com / api.newsagent-ai.com.

server {
    listen 80;
    server_name app.REPLACE_WITH_DOMAIN;

    # REPLACE: path to news-agent/frontend's production build output.
    root /opt/newsagent/news-agent/frontend/dist;
    index index.html;

    # SPA — every path is a frontend route, no backend proxying on this host.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.REPLACE_WITH_DOMAIN;

    # Every path on this host goes to the backend — no SPA fallback, no
    # collision risk as more routers/prefixes get added over time.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
